[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — future-proofs deep links if routing is added later
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must not be long-cached or updates won't propagate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed assets are immutable — let CDN cache aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
